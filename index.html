<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma — Sell what you make. Keep what you earn.</title>
    <meta
      name="description"
      content="Landing pages, card checkout, email campaigns and payouts for creators in Croatia and the EU — in one calm place."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Luma" />
    <meta property="og:title" content="Luma — Sell what you make. Keep what you earn." />
    <meta
      property="og:description"
      content="Landing pages, card checkout, email campaigns and payouts for creators in Croatia and the EU — in one calm place."
    />
    <meta property="og:url" content="%VITE_PUBLIC_SITE_URL%/" />
    <meta property="og:image" content="%VITE_PUBLIC_SITE_URL%/luma-mark-512.png" />
    <script>
      // Sets data-theme before the first paint: the stored choice, else the OS preference.
      ;(function () {
        var theme = null
        try {
          var stored = window.localStorage.getItem('luma.theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <script>
      // The signed-in app (/app, /admin) may wear a colour palette: its CSS was saved with the choice and is applied
      // before the first paint. The homepage, auth and creators' public pages never get one.
      ;(function () {
        var path = window.location.pathname
        if (path.indexOf('/app/') !== 0 && path.indexOf('/admin') !== 0) return
        document.documentElement.setAttribute('data-app', '')
        try {
          var css = window.localStorage.getItem('luma.palette.css')
          if (!css) return
          var style = document.createElement('style')
          style.id = 'luma-palette'
          style.textContent = css
          document.head.appendChild(style)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
