    <meta property="og:title" content="Luma — Sell what you make. Keep what you earn." />
    <meta
      property="og:description"
      content="Landing pages, card checkout, email campaigns and payouts for creators across the Balkans — in one calm place."
    />
    <meta property="og:url" content="%VITE_PUBLIC_SITE_URL%/" />
    <meta property="og:image" content="%VITE_PUBLIC_SITE_URL%/luma-mark-512.png" />
    <script>
      // Sets data-theme before the first paint: the stored choice, else the OS preference.
      ;(function () {
        var theme = null
        try {
          var stored = window.localStorage.getItem('luma.theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"
